name: Robustness Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python test_cases_v2_comprehensive.py

      - name: Run benchmark smoke (deterministic quick)
        run: |
          python b3_kdf_file_tests/run_b3_kdf_file_benchmark.py --mode deterministic --max-size-mb 4 --stability-seconds 3

      - name: Upload latest benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b3-kdf-benchmark-artifacts
          path: b3_kdf_file_tests/results/
